[package]
name = "gazoo"
version = "0.1.0"
description = "Local image generation desktop app"
authors = ["gazoo"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "gazoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tracing-appender = "=0.2.5"
rusqlite_migration = "=2.7.0"
tokio = { version = "=1.54.1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }
uuid = { version = "=1.29.3", features = ["v7", "v4"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream"] }
async-trait = "=0.1.92"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
trash = "=5.4.0"

